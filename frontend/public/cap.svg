<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <radialGradient id="siuFaviconRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B30000" />
      <stop offset="100%" stop-color="#7A0000" />
    </radialGradient>
    <linearGradient id="siuFaviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  <!-- Outer Seal -->
  <circle cx="50" cy="50" r="48" fill="url(#siuFaviconRed)" stroke="url(#siuFaviconGold)" stroke-width="3"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="0.8" stroke-dasharray="2 2"/>
  
  <!-- Radiating Fan Ribs -->
  <line x1="50" y1="70" x2="24" y2="44" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />
  <line x1="50" y1="70" x2="33" y2="35" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />
  <line x1="50" y1="70" x2="43" y2="30" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />
  <line x1="50" y1="70" x2="50" y2="28" stroke="#D4AF37" stroke-width="1.5" />
  <line x1="50" y1="70" x2="57" y2="30" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />
  <line x1="50" y1="70" x2="67" y2="35" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />
  <line x1="50" y1="70" x2="76" y2="44" stroke="#D4AF37" stroke-width="1.2" opacity="0.85" />

  <!-- Radiating Fan Arc Petals -->
  <path d="M 23 44 C 28 35, 36 28, 50 26 C 64 28, 72 35, 77 44 C 73 40, 64 34, 50 34 C 36 34, 27 40, 23 44 Z" fill="url(#siuFaviconGold)" />
  <path d="M 28 48 C 34 40, 41 35, 50 33 C 59 35, 66 40, 72 48 C 68 44, 60 39, 50 39 C 40 39, 32 44, 28 48 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Central Birds in Flight -->
  <path d="M 50 36 Q 47 41 42 42 Q 47 43 50 47 Q 53 43 58 42 Q 53 41 50 36 Z" fill="#FFFFFF" />
  <path d="M 37 46 Q 34 50 30 50 Q 34 52 37 54 Q 39 51 43 50 Q 40 49 37 46 Z" fill="url(#siuFaviconGold)" />
  <path d="M 63 46 Q 60 49 57 50 Q 61 51 63 54 Q 66 52 70 50 Q 66 50 63 46 Z" fill="url(#siuFaviconGold)" />

  <!-- Base Pivot -->
  <circle cx="50" cy="72" r="4.5" fill="url(#siuFaviconGold)" stroke="#FFFFFF" stroke-width="1" />
  <circle cx="50" cy="72" r="2" fill="#7A0000" />

  <!-- Bottom Ribbon with Vasudhaiva Kutumbakam -->
  <path d="M 20 82 Q 50 87 80 82 L 83 89 Q 50 94 17 89 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="0.8" />
  <text x="50" y="88" text-anchor="middle" font-size="5.8" font-weight="900" fill="#7A0000" font-family="serif">वसुधैव कुटुम्बकम्</text>
</svg>
